[package]
name = "anqa-core"
version = "0.1.0"
edition = "2021"
description = "Session store ingest: typed events, list meta, walk (anqa._core)"
license = "MIT"
publish = false

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
pyo3 = { version = "0.25", optional = true }

[features]
default = []
extension-module = ["dep:pyo3", "pyo3/extension-module"]
