# Copy to ~/.groket/notes_schema.toml and edit field ids/labels for your workflow.
# Field ids must match ^[A-Za-z_][A-Za-z0-9_-]*$
# Labels are free-form (shown as-is in the TUI). Without this file, package
# defaults use Fluent messages notes-field-summary / notes-field-detail.

schema_id = "default"

[[fields]]
id = "summary"
label = "Summary"

[[fields]]
id = "detail"
label = "Detail"
