#:schema https://indynull.github.io/anqa/schemas/config.schema.json

# Prefs for the terminal app and the desktop HUD.
# Copy to ~/.anqa/config.toml. Missing keys use defaults.

theme = "auto"
follow_os = false
auto_serve = true
live_refresh_workers = 1

[hud]
window_mode = false
global_shortcut = ""
desktop_notifications = true

[export]
default_profile = ""

