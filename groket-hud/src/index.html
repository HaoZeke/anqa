<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>groket</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="./main.js" defer></script>
  </head>
  <body>
    <div class="shell" id="shell">
      <header class="search-row">
        <span class="mark" aria-hidden="true" title="groket">
          <svg class="mark-svg" viewBox="0 0 32 32" width="18" height="18" fill="none">
            <path
              d="M22.5 12.2c-1.1-3.2-4.2-5.5-7.8-5.5-4.6 0-8.3 3.5-8.3 8.3s3.7 8.3 8.3 8.3c3.4 0 6.3-1.9 7.6-4.7"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
            />
            <path
              d="M16.2 16h7.1v5.2"
              stroke="currentColor"
              stroke-width="2.4"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </span>
        <input
          id="q"
          type="search"
          autocomplete="off"
          spellcheck="false"
          placeholder="Search sessions"
          autofocus
        />
        <kbd class="hint" id="hotkey-hint">⌘⇧G</kbd>
      </header>
      <div class="body">
        <ul id="results" class="results" role="listbox"></ul>
        <aside class="detail-pane">
          <nav class="tabs" id="tabs" role="tablist">
            <button type="button" data-tab="overview" class="tab active" role="tab">Overview</button>
            <button type="button" data-tab="turns" class="tab" role="tab">Turns</button>
            <button type="button" data-tab="timeline" class="tab" role="tab">Timeline</button>
            <button type="button" data-tab="findings" class="tab" role="tab">Findings</button>
            <button type="button" data-tab="notes" class="tab" role="tab">Notes</button>
          </nav>
          <div class="tl-search-bar" id="tl-search-bar" hidden>
            <label class="tl-kind-label" for="tl-kind">Type</label>
            <select id="tl-kind" class="tl-kind" aria-label="Event type filter">
              <option value="all" selected>All events</option>
              <option value="tools">Tools only</option>
              <option value="user">User messages</option>
              <option value="asst">Assistant</option>
              <option value="sess">Session markers</option>
              <option value="errors">Errors only</option>
            </select>
            <input
              id="tl-q"
              type="search"
              autocomplete="off"
              spellcheck="false"
              placeholder="Filter events"
            />
            <span class="tl-search-meta" id="tl-search-meta"></span>
          </div>
          <div id="detail" class="detail" role="tabpanel">
            <p class="empty-state">Select a session</p>
          </div>
        </aside>
      </div>
      <footer class="foot">
        <span id="status">connecting…</span>
        <span class="foot-keys"><kbd>↑↓</kbd> <kbd>↵</kbd> <kbd>/</kbd> <kbd>esc</kbd></span>
      </footer>
    </div>
  </body>
</html>
