[package]
name = "groket-hud"
version = "0.1.0"
description = "Sol-style session palette for groket control plane"
authors = ["Ali-Akber Saifee"]
edition = "2021"

[lib]
name = "groket_hud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Linux: GTK type hint so tiling shells treat the palette as a dialog, not a tile.
[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
gdk = "0.18"
gtk = "0.18"

# Default ``groket hud`` path is release — make that binary as small/fast as practical.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
